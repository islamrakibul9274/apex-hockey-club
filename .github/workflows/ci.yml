name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Both jobs get a real MongoDB so the integration and end-to-end suites
# actually run. They previously skipped or failed, which meant the most
# valuable tests in the repository were the ones CI never executed.
#
# A service container rather than a repository secret: no credential to leak,
# and every run starts from an empty database.

env:
  # Placeholder only. The suites fail closed without a real secret, and no
  # production value is ever available to CI.
  AUTH_SECRET: ci-placeholder-secret-not-used-in-production
  MONGODB_URI: mongodb://localhost:27017/apex_hockey_ci

jobs:
  verify:
    name: Type check, lint, unit and integration tests
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Apply migrations
        run: npm run migrate
        continue-on-error: true

      - name: Seed content
        run: npm run seed
        continue-on-error: true

      # Both suites run for real against the service container.
      - name: Unit and integration tests
        run: npm test

      # Poll rather than using wait-on, which is not a project dependency and
      # would pull an extra package into CI for one wait.
      - name: HTTP auth checks
        run: |
          RATE_LIMIT_DISABLED=true npm run dev -- --port 3000 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3000/api/products >/dev/null 2>&1; then break; fi
            if [ "$i" = "90" ]; then echo "server never became ready"; exit 1; fi
            sleep 2
          done
          bash scripts/verify-auth.sh http://localhost:3000
          bash scripts/verify-features.sh http://localhost:3000

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: verify

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-placeholder-secret-not-used-in-production
          MONGODB_URI: mongodb://localhost:27017/apex_hockey_ci

      - name: Seed content
        run: npm run seed
        continue-on-error: true

      # The suite signs up and submits a contact inquiry, both of which need a
      # working database. It tears its own fixtures down afterwards.
      - name: Playwright
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3100
          MONGODB_URI: mongodb://localhost:27017/apex_hockey_ci

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7